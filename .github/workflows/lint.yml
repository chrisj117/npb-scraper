name: Linting

on:
  push:
    paths:
      - "**/*.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
      - name: Install ruff
        run: pip install ruff
      - name: Linting the code with ruff
        run: ruff check --extend-select E501 .
